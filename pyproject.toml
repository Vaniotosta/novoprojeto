[project]
name = "novoprojeto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vanio Tosta", email = "vaniobahia@hotmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "mlflow>=3.15.1",
    "numpy>=2.5.2",
    "pandas<3",
    "plotly>=7.0.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[project.scripts]
novoprojeto = "novoprojeto:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
]
